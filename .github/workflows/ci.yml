name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils make python3

      - name: Show versions
        run: |
          clang --version
          ld --version | head -1
          python3 --version

      - name: Build
        run: make

      - name: Run test suite
        run: make test
